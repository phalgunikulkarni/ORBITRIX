name: orbitrx
description: A minimal Flutter app for ORBITRIX
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.0  # Native Google Maps SDK
  flutter_blue_plus: ^1.31.8  # For BLE communication with nearby vehicles
  permission_handler: ^11.1.0  # For handling Bluetooth permissions
  location: ^5.0.3  # Optional - only for GPS features
  geolocator: ^9.0.2  # For GPS speed tracking (optional)
  latlong2: ^0.9.0
  geocoding: ^2.1.1  # Keep major version for compatibility
  http: ^1.1.0
  intl: ^0.18.1
  google_maps_webservice2: ^1.0.5 # For null-safe programmatic access to Google Places API
  shared_preferences: ^2.2.0  # For local storage of user and vehicle data

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

